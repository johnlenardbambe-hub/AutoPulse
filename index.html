<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AutoPulse AI - Smart Vehicle Tracking</title>
  
  <!-- iOS PWA / Safari Native App Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AutoPulse AI">
  <link rel="apple-touch-icon" href="https://placehold.co/180x180/0f172a/38bdf8?text=AutoPulse">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js CDN -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    
    /* iOS WebKit Native Styling */
    .ios-scroll {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    
    /* iOS Safe Area Insets for Notch / Dynamic Island / Home Indicator */
    .mobile-screen {
      max-width: 420px;
      height: 100dvh;
      max-height: 840px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Disable text selection highlights on interactive buttons for native feel */
    button, input, select {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-0 sm:p-4 font-sans antialiased selection:bg-cyan-500 selection:text-white">

  <!-- Main Mobile App Frame -->
  <div x-data="appData()" x-init="initApp()" class="mobile-screen w-full bg-slate-900 sm:rounded-[40px] border-0 sm:border-[8px] border-slate-800 flex flex-col justify-between relative overflow-hidden transition-all duration-300">
    
    <!-- Top Status Bar Simulation -->
    <div class="bg-slate-950/80 backdrop-blur-md px-6 pt-3 pb-2 flex justify-between items-center border-b border-slate-800/80 z-30 shrink-0 text-xs text-slate-400">
      <span x-text="currentTime" class="font-semibold text-slate-200">9:41 AM</span>
      <div class="flex items-center space-x-2">
        <span class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping mr-1"></span> Live Sync
        </span>
        <i class="fa-solid fa-wifi text-[11px]"></i>
        <i class="fa-solid fa-battery-full text-xs text-slate-300"></i>
      </div>
    </div>

    <!-- Main Header -->
    <header class="bg-slate-900/95 border-b border-slate-800 px-5 py-3 flex justify-between items-center z-20 shrink-0">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white font-bold shadow-lg shadow-cyan-500/20">
          <i class="fa-solid fa-gauge-high text-sm"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm text-slate-100 tracking-wide">AutoPulse AI</h1>
          <button @click="showVehicleModal = true" class="text-xs text-cyan-400 hover:text-cyan-300 flex items-center gap-1 transition">
            <span x-text="`${vehicle.year} ${vehicle.make} ${vehicle.model}`"></span>
            <span class="text-[9px] px-1.5 py-0.2 rounded bg-slate-800 text-slate-400 font-semibold border border-slate-700" x-text="vehicle.type"></span>
            <i class="fa-solid fa-pen-to-square text-[10px]"></i>
          </button>
        </div>
      </div>
      
      <div class="flex items-center space-x-1.5">
        <!-- OBD-II Status Indicator Button -->
        <button @click="obdConnected = !obdConnected" 
                :class="obdConnected ? 'bg-cyan-500/20 text-cyan-400 border-cyan-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'"
                class="px-2 py-1 rounded-full text-[10px] font-medium border flex items-center gap-1 transition"
                title="Toggle OBD-II Dongle Connection">
          <i class="fa-solid fa-microchip"></i>
          <span x-text="obdConnected ? 'OBD-II' : 'No OBD'"></span>
        </button>

        <!-- CarPlay Status -->
        <button @click="carPlayConnected = !carPlayConnected" 
                :class="carPlayConnected ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-slate-800 text-slate-400 border-slate-700'"
                class="px-2 py-1 rounded-full text-[10px] font-medium border flex items-center gap-1 transition">
          <i class="fa-solid fa-car"></i>
          <span x-text="carPlayConnected ? 'CarPlay' : 'Off'"></span>
        </button>
      </div>
    </header>

    <!-- Scrollable Content Viewport -->
    <main class="flex-1 overflow-y-auto ios-scroll px-4 py-4 space-y-4">

      <!-- ================= TAB 1: HOME DASHBOARD ================= -->
      <template x-if="activeTab === 'home'">
        <div class="space-y-4">
          <!-- Real-Time Dynamic Banner -->
          <div class="bg-gradient-to-r from-slate-800 to-slate-900 rounded-2xl p-4 border border-slate-700/60 shadow-lg relative overflow-hidden">
            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-cyan-500/10 rounded-full blur-xl pointer-events-none"></div>
            
            <div class="flex justify-between items-start mb-3">
              <div>
                <div class="flex items-center gap-2">
                  <span class="text-[10px] font-bold uppercase tracking-wider text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded-full border border-cyan-500/20">Active Telemetry</span>
                  <span x-show="obdConnected" class="text-[9px] font-mono text-emerald-400 bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/20">ECU Stream</span>
                </div>
                <h2 class="text-lg font-bold text-slate-100 mt-1" x-text="`${vehicle.year} ${vehicle.make} ${vehicle.model}`"></h2>
                <p class="text-xs text-slate-400">VIN: <span x-text="vehicle.vin" class="font-mono"></span></p>
              </div>
              <button @click="showVehicleModal = true" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg border border-slate-700 text-slate-300 text-xs transition">
                <i class="fa-solid fa-sliders"></i>
              </button>
            </div>

            <!-- Quick Metrics Grid (Powertrain Dynamic) -->
            <div class="grid grid-cols-3 gap-2 mt-4">
              <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-center">
                <span class="text-[10px] text-slate-400 block mb-0.5">Odometer</span>
                <span class="text-sm font-bold text-slate-100 font-mono" x-text="`${vehicle.odometer.toLocaleString('en-PH')} km`"></span>
              </div>
              <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-center">
                <span class="text-[10px] text-slate-400 block mb-0.5">Tire Pressure</span>
                <span class="text-sm font-bold text-emerald-400 font-mono" x-text="`${telemetry.tirePressure} PSI`"></span>
              </div>
              
              <!-- Metric Changes Based on Powertrain -->
              <template x-if="vehicle.type === 'Fuel'">
                <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-center">
                  <span class="text-[10px] text-slate-400 block mb-0.5">Coolant Temp</span>
                  <span class="text-sm font-bold text-cyan-400 font-mono" x-text="`${telemetry.coolantTemp}°C`"></span>
                </div>
              </template>
              <template x-if="vehicle.type === 'Electric'">
                <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-center">
                  <span class="text-[10px] text-slate-400 block mb-0.5">Battery SoC</span>
                  <span class="text-sm font-bold text-cyan-400 font-mono" x-text="`${telemetry.batterySoc}%`"></span>
                </div>
              </template>
              <template x-if="vehicle.type === 'Hybrid'">
                <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-center">
                  <span class="text-[10px] text-slate-400 block mb-0.5">Hybrid Temp</span>
                  <span class="text-sm font-bold text-cyan-400 font-mono" x-text="`${telemetry.coolantTemp - 4}°C`"></span>
                </div>
              </template>
            </div>

            <!-- Manual Refresh and Live Telemetry Banner Footer -->
            <div class="mt-3 flex justify-between items-center text-[10px] text-slate-400 border-t border-slate-800/80 pt-2">
              <div class="flex items-center gap-1.5">
                <button @click="refreshTelemetry()" 
                        class="px-2 py-0.5 bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700/80 rounded-lg flex items-center gap-1 transition active:scale-95"
                        title="Manually refresh ECU telemetry">
                  <i class="fa-solid fa-rotate text-[10px]" :class="{ 'animate-spin': isRefreshing }"></i>
                  <span class="font-medium text-[10px]">Refresh</span>
                </button>
                <span class="text-slate-300 font-medium">Live telemetry active</span>
              </div>
              <span x-text="`Updated ${lastUpdatedSec}s ago`"></span>
            </div>
          </div>

          <!-- Predictive Health & Powertrain Status Card -->
          <div class="bg-slate-800/60 rounded-2xl p-4 border border-slate-700/60 space-y-3">
            <!-- Header Badge changes based on Powertrain -->
            <div class="flex justify-between items-center">
              <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Powertrain & Emission Status</h3>
              <template x-if="vehicle.type === 'Fuel'">
                <span class="px-2 py-0.5 text-[10px] font-semibold bg-emerald-500/20 text-emerald-400 rounded-full border border-emerald-500/30">Ready for LTO / RA 8749</span>
              </template>
              <template x-if="vehicle.type === 'Electric'">
                <span class="px-2 py-0.5 text-[10px] font-semibold bg-cyan-500/20 text-cyan-400 rounded-full border border-cyan-500/30">Zero-Emission Certified</span>
              </template>
              <template x-if="vehicle.type === 'Hybrid'">
                <span class="px-2 py-0.5 text-[10px] font-semibold bg-indigo-500/20 text-indigo-400 rounded-full border border-indigo-500/30">Hybrid Synergy Optimal</span>
              </template>
            </div>

            <!-- Health Circular Gauge & Dynamic Metric -->
            <div class="flex items-center space-x-4 pt-1">
              <div class="relative w-16 h-16 flex items-center justify-center shrink-0">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                  <path class="text-slate-700" stroke-width="3.5" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                  <path class="text-cyan-400" :stroke-dasharray="vehicle.type === 'Electric' ? '99, 100' : (vehicle.type === 'Hybrid' ? '96, 100' : '94, 100')" stroke-width="3.5" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <span class="absolute text-sm font-black text-slate-100" x-text="vehicle.type === 'Electric' ? '99%' : (vehicle.type === 'Hybrid' ? '96%' : '94%')"></span>
              </div>

              <div class="flex-1 space-y-1.5">
                <!-- FUEL/ICE Powertrain Display -->
                <template x-if="vehicle.type === 'Fuel'">
                  <div>
                    <div class="flex justify-between text-xs">
                      <span class="text-slate-400">Oil Life Remaining</span>
                      <span class="font-bold text-amber-400" x-text="obdConnected ? `${obdOilMetrics.oilLifePercent}% (OBD-II)` : '42%'"></span>
                    </div>
                    <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden my-1">
                      <div class="bg-amber-400 h-full rounded-full transition-all duration-500" :style="`width: ${obdConnected ? obdOilMetrics.oilLifePercent : 42}%`"></div>
                    </div>
                    <p class="text-[11px] text-slate-400">Predicted Oil Change: <span class="text-slate-200 font-semibold" x-text="obdConnected ? `${Math.round(obdOilMetrics.oilLifePercent * 30)} km left` : '1,240 km left'"></span></p>
                  </div>
                </template>

                <!-- ELECTRIC (EV) Powertrain Display -->
                <template x-if="vehicle.type === 'Electric'">
                  <div>
                    <div class="flex justify-between text-xs">
                      <span class="text-slate-400">Battery Health (SoH)</span>
                      <span class="font-bold text-emerald-400">96%</span>
                    </div>
                    <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden my-1">
                      <div class="bg-emerald-400 h-full rounded-full" style="width: 96%"></div>
                    </div>
                    <p class="text-[11px] text-slate-400">Next Cell Inspection: <span class="text-slate-200 font-semibold">45,000 km left</span></p>
                  </div>
                </template>

                <!-- HYBRID (HEV) Powertrain Display -->
                <template x-if="vehicle.type === 'Hybrid'">
                  <div>
                    <div class="flex justify-between text-xs">
                      <span class="text-slate-400">Engine & EV Health</span>
                      <span class="font-bold text-indigo-400">88%</span>
                    </div>
                    <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden my-1">
                      <div class="bg-indigo-400 h-full rounded-full" style="width: 88%"></div>
                    </div>
                    <p class="text-[11px] text-slate-400">Predicted Synthetic Oil: <span class="text-slate-200 font-semibold">2,800 km left</span></p>
                  </div>
                </template>
              </div>
            </div>

            <!-- OBD-II Stream Detail Badge -->
            <div x-show="obdConnected && vehicle.type === 'Fuel'" class="mt-2 bg-slate-950 p-2 rounded-xl border border-slate-800 flex justify-between items-center text-[10px]">
              <span class="text-slate-400">PID 010C ECU Index: <span class="text-cyan-400 font-mono" x-text="obdOilMetrics.viscosityGrade"></span></span>
              <span class="text-emerald-400 font-mono" x-text="`Degradation: ${obdOilMetrics.degradationIndex}%`"></span>
            </div>
          </div>

          <!-- Quick Trip Nav Banner -->
          <div class="p-3 bg-gradient-to-r from-cyan-900/40 to-blue-900/40 border border-cyan-500/30 rounded-2xl flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="p-2 bg-cyan-500/20 text-cyan-400 rounded-xl">
                <i class="fa-solid fa-route"></i>
              </div>
              <div>
                <h4 class="text-xs font-bold text-slate-100">Zero-Effort Background Logging</h4>
                <p class="text-[10px] text-slate-300" x-text="`${trips.length} background trips recorded`"></p>
              </div>
            </div>
            <button @click="activeTab = 'trips'" class="px-3 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl shadow-md transition">
              View
            </button>
          </div>
        </div>
      </template>


      <!-- ================= TAB 2: TRIP TRACKER ================= -->
      <template x-if="activeTab === 'trips'">
        <div class="space-y-4">
          <!-- Header & Actions -->
          <div class="flex justify-between items-center">
            <div>
              <h2 class="text-sm font-bold text-slate-100">Background Trip Log</h2>
              <p class="text-[11px] text-slate-400">Automatically synced telemetry & custom trips</p>
            </div>
            <div class="flex gap-1.5">
              <button @click="showAddTripModal = true" class="px-2.5 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-xs rounded-xl flex items-center gap-1 transition shadow-lg shadow-cyan-500/20">
                <i class="fa-solid fa-plus"></i>
                <span>Add Trip</span>
              </button>
              <button @click="simulateTrip()" class="px-2 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium text-xs rounded-xl border border-slate-700 flex items-center gap-1 transition">
                <i class="fa-solid fa-bolt text-amber-400"></i>
                <span>Simulate</span>
              </button>
            </div>
          </div>

          <!-- Google Maps Traffic Predictor Card -->
          <div class="bg-gradient-to-br from-slate-900 via-slate-900 to-slate-950 p-4 rounded-2xl border border-cyan-500/30 space-y-3 relative overflow-hidden shadow-lg">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-map-location-dot text-cyan-400 text-sm"></i>
                <h3 class="text-xs font-bold text-slate-100 uppercase tracking-wider">Google Maps Traffic Predictor</h3>
              </div>
              <button @click="showAddRouteModal = true" class="text-[10px] font-medium px-2 py-0.5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 hover:bg-cyan-500/20 transition flex items-center gap-1">
                <i class="fa-solid fa-plus text-[9px]"></i> Add Route
              </button>
            </div>

            <!-- Area & Route Selection Inputs -->
            <div class="space-y-2 text-xs">
              <!-- Step 1: Select Area / City -->
              <div>
                <label class="block text-[10px] text-slate-400 mb-1 font-semibold flex items-center justify-between">
                  <span>1. Select Area / Region</span>
                  <span class="text-[9px] text-cyan-400" x-text="`${availableAreas.length} Areas Available`"></span>
                </label>
                <select x-model="selectedArea" @change="onAreaChange()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-medium">
                  <template x-for="area in availableAreas" :key="area">
                    <option :value="area" x-text="area"></option>
                  </template>
                </select>
              </div>

              <!-- Step 2: Select Corridor / Route within chosen Area -->
              <div>
                <label class="block text-[10px] text-slate-400 mb-1 font-semibold flex items-center justify-between">
                  <span>2. Select Route in <span x-text="selectedArea" class="text-cyan-400"></span></span>
                  <span class="text-[9px] text-slate-400" x-text="`${filteredRoutes.length} Route(s)`"></span>
                </label>
                <select x-model="selectedRoute" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                  <template x-for="r in filteredRoutes" :key="r.id">
                    <option :value="r.id" x-text="`${r.name} (${r.distance} km)${r.custom ? ' [Custom]' : ''}`"></option>
                  </template>
                </select>
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] text-slate-400 mb-1">Traffic Model</label>
                  <select x-model="trafficModel" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                    <option value="best_guess">Best Guess</option>
                    <option value="pessimistic">Pessimistic (Rush Hour)</option>
                    <option value="optimistic">Optimistic (Off-Peak)</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[10px] text-slate-400 mb-1">Departure Time</label>
                  <select x-model="departureTime" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-cyan-500">
                    <option value="now">Depart Now</option>
                    <option value="rush_am">Peak AM (8:00 AM)</option>
                    <option value="rush_pm">Peak PM (5:30 PM)</option>
                  </select>
                </div>
              </div>

              <!-- Predict Button -->
              <button @click="fetchGoogleTraffic()" 
                      class="w-full py-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold text-xs rounded-xl flex items-center justify-center gap-1.5 transition shadow-md shadow-cyan-500/20 active:scale-98">
                <i class="fa-solid fa-satellite-dish" :class="{ 'animate-spin': isFetchingGoogle }"></i>
                <span x-text="isFetchingGoogle ? 'Querying Google Routes API...' : 'Check Google Maps Traffic'"></span>
              </button>
            </div>

            <!-- Predicted Traffic Result Display -->
            <template x-if="googlePrediction">
              <div class="bg-slate-950/80 p-3 rounded-xl border border-slate-800 space-y-2 text-xs transition-all">
                <div class="flex justify-between items-center border-b border-slate-800 pb-1.5">
                  <span class="text-[10px] text-slate-400">Est. Travel Time</span>
                  <div class="flex items-center gap-2">
                    <span class="text-slate-400 line-through text-[10px]" x-text="`${googlePrediction.baselineMinutes}m normal`"></span>
                    <span class="font-bold text-amber-400 font-mono" x-text="`${googlePrediction.trafficMinutes} mins`"></span>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-2 text-center pt-0.5">
                  <div class="bg-slate-900 p-2 rounded-lg border border-slate-800/80">
                    <span class="text-[9px] text-slate-400 block">Google Congestion Index</span>
                    <span class="text-xs font-bold text-cyan-400 font-mono" x-text="`${googlePrediction.congestionPct}%`"></span>
                  </div>
                  <div class="bg-slate-900 p-2 rounded-lg border border-slate-800/80">
                    <span class="text-[9px] text-slate-400 block">Traffic Delay</span>
                    <span class="text-xs font-bold text-red-400 font-mono" x-text="`+${googlePrediction.delayMinutes} mins`"></span>
                  </div>
                </div>

                <button @click="syncGoogleTrafficToAI()" 
                        class="w-full py-1.5 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-400 font-bold text-[11px] rounded-lg border border-cyan-500/30 flex items-center justify-center gap-1 transition">
                  <i class="fa-solid fa-arrows-rotate"></i>
                  <span>Apply Severity to Dynamic Engine</span>
                </button>
              </div>
            </template>
          </div>

          <!-- Trip List -->
          <div class="space-y-2.5">
            <template x-for="(trip, index) in trips" :key="trip.id || index">
              <div class="bg-slate-800/60 p-3.5 rounded-2xl border border-slate-700/60 flex items-center justify-between transition hover:border-slate-600">
                <div class="flex items-center space-x-3 flex-1 min-w-0 mr-2">
                  <div class="w-9 h-9 rounded-xl bg-slate-900 border border-slate-700 flex items-center justify-center text-cyan-400 shrink-0">
                    <i :class="getTripIcon(trip.category)"></i>
                  </div>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center gap-2">
                      <h4 class="text-xs font-bold text-slate-100 truncate" x-text="trip.title"></h4>
                      <span class="px-1.5 py-0.2 text-[9px] rounded-md font-semibold shrink-0"

        initApp() {
          this.updateClock();
          setInterval(() => this.updateClock(), 1000);

          // Live Telemetry Stream Simulation
          setInterval(() => {
            this.lastUpdatedSec++;
            if (this.lastUpdatedSec > 15) {
              this.lastUpdatedSec = 0;
              this.telemetry.tirePressure = (32 + Math.random() * 2).toFixed(1);
              this.telemetry.coolantTemp = Math.floor(86 + Math.random() * 4);
            }
          }, 1000);
        },

        updateClock() {
          const now = new Date();
          this.currentTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        },

        refreshTelemetry() {
          this.isRefreshing = true;
          setTimeout(() => {
            this.lastUpdatedSec = 0;
            this.telemetry.tirePressure = (32.5 + Math.random() * 1.5).toFixed(1);
            this.telemetry.coolantTemp = Math.floor(87 + Math.random() * 3);
            if (this.vehicle.type === 'Electric') {
              this.telemetry.batterySoc = Math.max(10, Math.floor(this.telemetry.batterySoc - (Math.random() * 0.5)));
            }
            this.isRefreshing = false;
          }, 750);
        },

        get calculatedInterval() {
          const base = 5000;
          const trafficPenalty = (this.aiParams.traffic / 100) * 800;
          const idlePenalty = this.aiParams.idling * 40;
          const storagePenalty = this.aiParams.storage * 50;
          return Math.max(2500, Math.round(base - trafficPenalty - idlePenalty - storagePenalty));
        },

        formatPeso(amount) {
          return new Intl.NumberFormat('en-PH', { style: 'currency', currency: 'PHP' }).format(amount);
        },

        calcTotalSpend() {
          return this.services.reduce((sum, item) => sum + Number(item.cost), 0);
        },

        getTripIcon(category) {
          switch(category) {
            case 'commute': return 'fa-solid fa-briefcase';
            case 'errand': return 'fa-solid fa-cart-shopping';
            case 'highway': return 'fa-solid fa-road';
            default: return 'fa-solid fa-car';
          }
        },

        // --- GOOGLE MAPS TRAFFIC PREDICTOR LOGIC ---
        fetchGoogleTraffic() {
          this.isFetchingGoogle = true;
          const route = this.presetRoutes.find(r => r.id === this.selectedRoute) || this.presetRoutes[0];
          
          setTimeout(() => {
            let modelMultiplier = 1.0;
            if (this.trafficModel === 'pessimistic') modelMultiplier = 1.35;
            if (this.trafficModel === 'optimistic') modelMultiplier = 0.85;

            let timeMultiplier = 1.0;
            if (this.departureTime === 'rush_am') timeMultiplier = 1.4;
            if (this.departureTime === 'rush_pm') timeMultiplier = 1.6;

            const baseline = Math.round(route.baseMin);
            const totalMin = Math.round(route.baseMin * route.delayFactor * modelMultiplier * timeMultiplier);
            const delayMin = Math.max(0, totalMin - baseline);
            const congestionPct = Math.min(100, Math.round((delayMin / baseline) * 100));

            this.googlePrediction = {
              routeTitle: route.name,
              baselineMinutes: baseline,
              trafficMinutes: totalMin,
              delayMinutes: delayMin,
              congestionPct: congestionPct
            };

            this.isFetchingGoogle = false;
          }, 800);
        },

        syncGoogleTrafficToAI() {
          if (!this.googlePrediction) return;
          this.aiParams.traffic = this.googlePrediction.congestionPct;
          this.activeTab = 'ai';
        },

        addCustomRoute() {
          if (!this.newRoute.origin || !this.newRoute.destination || !this.newRoute.distance) return;

          const areaName = this.newRoute.area.trim() || 'Custom Area';
          const dist = parseFloat(this.newRoute.distance);
          let factor = 1.5;
          if (this.newRoute.severity === 'Heavy') factor = 2.2;
          if (this.newRoute.severity === 'Light') factor = 1.1;

          const createdRoute = {
            id: 'custom_' + Date.now(),
            area: areaName,
            name: `${this.newRoute.origin} to ${this.newRoute.destination}`,
            distance: dist,
            baseMin: Math.round(dist * 2.2),
            delayFactor: factor,
            custom: true
          };

          this.presetRoutes.unshift(createdRoute);
          this.selectedArea = areaName;
          this.selectedRoute = createdRoute.id;

          this.newRoute = { area: '', origin: '', destination: '', distance: '', severity: 'Moderate' };
          this.showAddRouteModal = false;
          this.fetchGoogleTraffic();
        },

        // --- TRIP TRACKER ACTIONS ---
        addTrip() {
          if (!this.newTrip.title || !this.newTrip.distance) return;

          const created = {
            id: Date.now(),
            title: this.newTrip.title,
            date: 'Just now',
            duration: '15m',
            distance: parseFloat(this.newTrip.distance),
            idle: parseInt(this.newTrip.idle) || 0,
            severity: this.newTrip.severity,
            category: this.newTrip.category
          };

          this.trips.unshift(created);
          this.vehicle.odometer += parseFloat(this.newTrip.distance);

          this.newTrip = { title: '', distance: '', idle: 10, severity: 'Smooth', category: 'commute' };
          this.showAddTripModal = false;
        },

          const randomDist = (3 + Math.random() * 15).toFixed(1);
          const newTripObj = {
            id: Date.now(),
            title: 'Auto-Logged Background Trip',
            date: 'Just now',
            duration: `${Math.floor(10 + Math.random() * 20)}m`,
            distance: parseFloat(randomDist),
            idle: Math.floor(5 + Math.random() * 20),
            severity: Math.random() > 0.5 ? 'Stop-and-Go' : 'Smooth',
            category: 'commute'
          };
          this.trips.unshift(newTripObj);
          this.vehicle.odometer += parseFloat(randomDist);
        },

        openEditTripModal(trip) {
          this.editingTrip = { ...trip };
          this.showEditTripModal = true;
        },

        saveTripLabel() {
          const idx = this.trips.findIndex(t => t.id === this.editingTrip.id);
          if (idx !== -1) {
            this.trips[idx].title = this.editingTrip.title;
            this.trips[idx].category = this.editingTrip.category;
          }
          this.showEditTripModal = false;
        },

        deleteTrip(id) {
          this.trips = this.trips.filter(t => t.id !== id);
          this.showEditTripModal = false;
        },

        // --- SERVICE LEDGER ACTIONS ---
        handleFileUpload(event, targetObj = null) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
              if (targetObj) {
                targetObj.receiptUrl = e.target.result;
              } else {
                this.newService.receiptUrl = e.target.result;
              }
            };
            reader.readAsDataURL(file);
          }
        },

        viewReceipt(item) {
          this.activeReceiptItem = item;
          this.showReceiptModal = true;
        },

        addServiceLog() {
          if (!this.newService.title || !this.newService.cost) return;

          this.services.unshift({
            id: Date.now(),
            title: this.newService.title,
            center: this.newService.center || 'Authorized Service Center',
            date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
            odometer: this.vehicle.odometer,
            cost: parseFloat(this.newService.cost),
            receiptUrl: this.newService.receiptUrl || ''
          });

          this.newService = { title: '', cost: '', center: '', receiptUrl: '' };
          this.showAddServiceModal = false;
        },

        confirmDeleteService(item) {
          this.deletingServiceItem = item;
          this.showDeleteConfirmModal = true;
        },

        executeDeleteService() {
          if (this.deletingServiceItem) {
            this.services = this.services.filter(s => s.id !== this.deletingServiceItem.id);
            this.deletingServiceItem = null;
          }
          this.showDeleteConfirmModal = false;
        }
      }
    }
  </script>
</body>
</html>
